---
- name: Install disconnected Single Node OpenShift on KVM
  hosts: selected_hosts
  gather_facts: true
  serial: 1
  any_errors_fatal: true

  vars_files:
    - ../vars/openshift_sno_defaults.yml

  vars:
    sno_request: "{{ cluster_config }}"
    sno_host_request: "{{ selected_hosts_config | first }}"
    target_schema_version: 1
    target_id: "lindeploy-{{ inventory_hostname | lower | regex_replace('[^a-z0-9-]', '-') }}"
    target_provider: libvirt
    automation_mode: apply
    target_modification_approved: "{{ sno_request.target_modification_approved | default(false) }}"
    cluster_name: "{{ sno_request.cluster_name }}"
    base_dns_domain: "{{ sno_request.base_domain }}"
    openshift_version: "{{ openshift_default_version if sno_request.openshift_version | default('stable') == 'stable' else sno_request.openshift_version }}"
    cpu_architecture: "{{ 'x86_64' if sno_request.architecture | default('amd64') == 'amd64' else sno_request.architecture }}"
    openshift_mirror_registry: "{{ sno_request.mirror_registry }}"
    openshift_fips_enabled: "{{ sno_request.fips | default(false) }}"
    cluster_network_cidr: "{{ sno_request.cluster_network_cidr }}"
    cluster_network_host_prefix: "{{ sno_request.host_prefix }}"
    service_network_cidr: "{{ sno_request.service_network_cidr }}"
    sno_ip_address: "{{ sno_host_request.node_ip }}"
    sno_prefix_length: "{{ sno_host_request.prefix_length }}"
    sno_gateway: "{{ sno_host_request.gateway }}"
    sno_dns_servers: "{{ sno_request.dns_servers }}"
    sno_interface_name: "{{ sno_host_request.interface_name }}"
    sno_node_name: "{{ sno_host_request.node_name }}"
    installation_disk_path: "{{ sno_host_request.installation_disk }}"
    install_confirmation: "{{ sno_request.install_confirmation | default('') }}"
    libvirt_uri: qemu:///system
    libvirt_vm_name: "{{ sno_host_request.vm_name }}"
    libvirt_network_name: "{{ sno_host_request.libvirt_network }}"
    libvirt_pool_name: "{{ sno_host_request.storage_pool }}"
    libvirt_vm_vcpus: "{{ sno_host_request.vcpu }}"
    libvirt_vm_memory_mb: "{{ sno_host_request.memory_gib | int * 1024 }}"
    libvirt_vm_disk_gb: "{{ sno_host_request.disk_gib }}"
    cluster_count: 1
    minimum_installation_disk_bytes: 120000000000
    libvirt_firmware: "{{ 'efi' if sno_request.boot_mode | default('uefi') == 'uefi' else 'bios' }}"
    libvirt_vm_autostart: "{{ sno_request.vm_autostart | default(false) }}"
    workshop_id: "lindeploy-{{ cluster_name }}"
    workshop_base_domain: "{{ base_dns_domain }}"
    libvirt_network_cidr: "{{ sno_request.machine_network_cidr }}"
    libvirt_gateway: "{{ sno_host_request.gateway }}"
    libvirt_netmask: 255.255.255.0
    libvirt_network_prefix: "{{ sno_host_request.node_ip.split('.')[0:3] | join('.') }}"
    libvirt_dhcp_start: "{{ libvirt_network_prefix }}.2"
    libvirt_dhcp_end: "{{ libvirt_network_prefix }}.254"
    libvirt_bridge_name: "virbr-sno{{ sno_host_request.host_id }}"
    sno_mac_address: "{{ sno_host_request.mac_address if sno_host_request.mac_address | default('') | length > 0 else '52:54:00:01:%02x:%02x' | format(sno_host_request.host_id | int % 256, sno_host_request.node_ip.split('.')[-1] | int) }}"
    workshop_clusters:
      - name: "{{ cluster_name }}"
        target_id: "{{ target_id }}"
        vm_name: "{{ libvirt_vm_name }}"
        ip_address: "{{ sno_ip_address }}"
        mac_address: "{{ sno_mac_address }}"
        fqdn: "{{ cluster_name }}.{{ base_dns_domain }}"
    dns_provider: existing
    dns_validation_server: "{{ sno_gateway if sno_request.dns_management | default('managed') == 'managed' else (sno_dns_servers | first) }}"
    dns_enforce_before_boot: true
    wait_for_cluster_convergence: true
    require_cluster_convergence: true
    require_workshop_readiness: true
    oc_binary_path: /usr/local/libexec/lindeploy-openshift/oc
    openshift_agent_assets_root: "{{ ansible_env.HOME }}/.local/share/lindeploy/openshift-agent"
    openshift_agent_assets_directory: "{{ openshift_agent_assets_root }}/{{ cluster_name }}"
    discovery_iso_path: "{{ openshift_agent_assets_directory }}/agent.{{ cpu_architecture }}.iso"
    credentials_directory: "{{ openshift_agent_assets_directory }}/auth"
    kubeconfig_path: "{{ credentials_directory }}/kubeconfig"
    kubeadmin_password_path: "{{ credentials_directory }}/kubeadmin-password"
    libvirt_ownership_marker_path: "{{ ansible_env.HOME }}/.local/share/lindeploy/ownership/{{ cluster_name }}.json"

  pre_tasks:
    - name: Require explicit SNO disk approval
      ansible.builtin.assert:
        that:
          - target_modification_approved | bool
          - install_confirmation == ('ERASE ' ~ installation_disk_path)
        fail_msg: "Enter exactly ERASE {{ installation_disk_path }} before installation."
        quiet: true

    - name: Read storage pool definition
      ansible.builtin.command:
        argv: [virsh, --connect, "{{ libvirt_uri }}", pool-dumpxml, "{{ libvirt_pool_name }}"]
      register: openshift_pool_xml
      changed_when: false
      failed_when: false

    - name: Select runtime storage paths
      ansible.builtin.set_fact:
        libvirt_pool_path: "{{ (openshift_pool_xml.stdout | regex_findall('<path>([^<]+)</path>') | first) if openshift_pool_xml.rc == 0 else '/var/lib/libvirt/images/' ~ libvirt_pool_name }}"
        libvirt_volume_name: "{{ libvirt_vm_name }}.qcow2"
        libvirt_volume_path: "{{ ((openshift_pool_xml.stdout | regex_findall('<path>([^<]+)</path>') | first) if openshift_pool_xml.rc == 0 else '/var/lib/libvirt/images/' ~ libvirt_pool_name) }}/{{ libvirt_vm_name }}.qcow2"
        libvirt_iso_runtime_path: "{{ ((openshift_pool_xml.stdout | regex_findall('<path>([^<]+)</path>') | first) if openshift_pool_xml.rc == 0 else '/var/lib/libvirt/images/' ~ libvirt_pool_name) }}/{{ libvirt_vm_name }}-agent.iso"
        libvirt_iso_target: sda

  roles:
    - role: libvirt_preflight
    - role: libvirt_network
    - role: libvirt_storage
    - role: dns_preflight
    - role: openshift_agent_assets
    - role: libvirt_vm
    - role: target_boot
    - role: openshift_agent_install
    - role: post_install_boot
    - role: cluster_verify

  post_tasks:
    - name: Enable VM autostart when requested
      ansible.builtin.command:
        argv: [virsh, --connect, "{{ libvirt_uri }}", autostart, "{{ libvirt_vm_name }}"]
      when: libvirt_vm_autostart | bool

    - name: Report disconnected SNO completion
      ansible.builtin.debug:
        msg:
          - "Disconnected SNO installation completed."
          - "Cluster: {{ cluster_name }}.{{ base_dns_domain }}"
          - "Kubeconfig: {{ kubeconfig_path }}"
          - "Mirror: {{ openshift_mirror_registry }}"
