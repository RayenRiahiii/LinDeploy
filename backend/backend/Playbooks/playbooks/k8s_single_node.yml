---
- name: Install Kubernetes Single Node
  hosts: selected_hosts
  become: yes
  gather_facts: false
  strategy: free
  vars_files:
    - ../vars/release_kubernetes_v1.36.3.yml
  vars:
    common_selinux_mode: enforcing
    common_firewalld_enabled: true
    common_firewalld_state: started
    common_firewalld_ports:
      - 6443/tcp
      - 10250/tcp
    common_firewalld_sources:
      - "{{ kubeadm_pod_network_cidr }}"
      - "{{ kubeadm_service_cidr }}"

  pre_tasks:
    - name: Probe conflicting K3s installation artifacts
      command:
        argv:
          - /bin/sh
          - -c
          - |
            for path; do
              if [ -e "$path" ] || [ -L "$path" ]; then
                printf '%s\n' "$path"
              fi
            done
          - k3s-conflict-check
          - /usr/local/bin/k3s
          - /etc/systemd/system/k3s.service
          - /etc/rancher/k3s/k3s.yaml
          - /var/lib/rancher/k3s/server
      register: kubernetes_k3s_conflict_artifacts
      changed_when: false

    - name: Probe conflicting existing Kubernetes installation artifacts
      command:
        argv:
          - /bin/sh
          - -c
          - |
            for path; do
              if [ -e "$path" ] || [ -L "$path" ]; then
                printf '%s\n' "$path"
              fi
            done
          - k8s-existing-check
          - /etc/kubernetes/admin.conf
          - /etc/kubernetes/manifests/kube-apiserver.yaml
          - /var/lib/etcd/member
          - /var/lib/kubelet/config.yaml
      register: kubernetes_existing_conflict_artifacts
      changed_when: false
      when: k8s_fail_on_existing_cluster | default(true) | bool

    - name: Refuse Kubernetes installation when conflicting platform is present
      fail:
        msg: >-
          {% if (kubernetes_k3s_conflict_artifacts.stdout_lines | default([]) | length > 0) and ((kubernetes_existing_conflict_artifacts.stdout_lines | default([]) | length) > 0) %}
          Kubernetes cannot be installed on {{ inventory_hostname }} because K3s installation artifacts are still present and an existing Kubernetes cluster is already present on this host. Run the K3s cleanup workflow and the Kubernetes cleanup workflow for this target and retry. Detected K3s: {{ kubernetes_k3s_conflict_artifacts.stdout_lines | join(', ') }}. Detected Kubernetes: {{ kubernetes_existing_conflict_artifacts.stdout_lines | join(', ') }}. No Kubernetes system changes were applied.
          {% elif kubernetes_k3s_conflict_artifacts.stdout_lines | default([]) | length > 0 %}
          Kubernetes cannot be installed on {{ inventory_hostname }} because K3s installation artifacts are still present. Run the K3s cleanup workflow for this target, verify that K3s is removed, and retry the Kubernetes installation. Detected artifacts: {{ kubernetes_k3s_conflict_artifacts.stdout_lines | join(', ') }}. No Kubernetes system changes were applied.
          {% else %}
          Kubernetes cannot be installed on {{ inventory_hostname }} because an existing Kubernetes cluster is already present on this host. Run the Kubernetes cleanup workflow on this target, verify that Kubernetes is removed, and retry the installation. Detected artifacts: {{ kubernetes_existing_conflict_artifacts.stdout_lines | join(', ') }}. No Kubernetes system changes were applied.
          {% endif %}
      when: >-
        ((kubernetes_k3s_conflict_artifacts.stdout_lines | default([]) | length) > 0) or
        ((k8s_fail_on_existing_cluster | default(true) | bool) and ((kubernetes_existing_conflict_artifacts.stdout_lines | default([]) | length) > 0))

    - name: Gather minimal installation facts
      setup:
        gather_subset:
          - "!all"
          - min
          - network
          - hardware
        filter:
          - ansible_os_family
          - ansible_default_ipv4
          - ansible_default_ipv6
          - ansible_architecture
          - ansible_distribution
          - ansible_distribution_release
          - ansible_distribution_major_version
          - ansible_hostname
          - ansible_swaptotal_mb

  roles:
    - role: lindeploy_ownership
      vars:
        lindeploy_ownership_action: prepare
    - common
    - containerd
    - cni_prepull
    - kubernetes
    - kubeadm_init
    - cni
    - role: lindeploy_ownership
      vars:
        lindeploy_ownership_action: activate
