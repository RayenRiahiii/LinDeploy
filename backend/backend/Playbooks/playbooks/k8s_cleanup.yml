---
- name: Cleanup Kubernetes Single Node
  hosts: selected_hosts
  become: yes
  gather_facts: false
  strategy: free
  vars_files:
    - ../vars/release_kubernetes_v1.36.3.yml

  pre_tasks:
    - name: Gather minimal cleanup facts
      setup:
        gather_subset:
          - "!all"
          - min
          - network
        filter:
          - ansible_os_family
          - ansible_default_ipv4
          - ansible_default_ipv6

  roles:
    - role: lindeploy_ownership
      vars:
        lindeploy_ownership_action: validate_cleanup
    - role: kubernetes_cleanup
      when: lindeploy_cleanup_required | bool
    - role: lindeploy_ownership
      vars:
        lindeploy_ownership_action: finalize_cleanup
