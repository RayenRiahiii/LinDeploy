---
# Fast Reset — remove the SNO VM, disk, and transient installation assets ONLY.
# Preserves: cached base RHCOS ISO, Quay mirror registry, storage pool definition,
#             ownership marker, kubeconfig templates, and user .bashrc CLI hooks.
# Use Full Cleanup (openshift_sno_cleanup.yml) when a complete decommission is required.
- name: Fast Reset of a LinDeploy managed Single Node OpenShift VM
  hosts: selected_hosts
  become: true
  gather_facts: true
  serial: 1
  any_errors_fatal: false

  vars:
    sno_request: "{{ cluster_config | default({}) }}"
    sno_host_request: "{{ (selected_hosts_config | default([]) | first) | default({}) }}"
    libvirt_uri: qemu:///system
    libvirt_vm_name: "{{ sno_host_request.vm_name | default(sno_request.cluster_name | default('sno-01')) }}"
    libvirt_pool_name: "{{ sno_host_request.storage_pool | default('sno-pool') }}"
    libvirt_volume_name: "{{ libvirt_vm_name }}.qcow2"
    workshop_id: "lindeploy-{{ sno_request.cluster_name | default('sno-01') }}"
    openshift_reset_accepted_legacy_workshop_ids:
      - sno-workshop
    openshift_ownership_marker_path: "/var/lib/lindeploy/ownership/{{ sno_request.cluster_name | default('sno-01') }}.json"
    openshift_agent_assets_directory: "/var/lib/lindeploy/openshift-agent/{{ sno_request.cluster_name | default('sno-01') }}"

  tasks:
    - name: Require exactly one managed SNO reset target
      ansible.builtin.assert:
        that:
          - cluster_config is defined
          - cluster_config is mapping
          - selected_hosts_config is defined
          - selected_hosts_config | length == 1
        fail_msg: >-
          SNO fast reset requires one cluster configuration and exactly one target
          VM definition. No host resource was changed.
        quiet: true

    # ── Ownership verification ──────────────────────────────────────────────────

    - name: Inspect the LinDeploy ownership marker
      ansible.builtin.stat:
        path: "{{ openshift_ownership_marker_path }}"
      register: openshift_reset_ownership_stat

    - name: Read the LinDeploy ownership marker
      ansible.builtin.slurp:
        src: "{{ openshift_ownership_marker_path }}"
      register: openshift_reset_ownership_content
      when: openshift_reset_ownership_stat.stat.isreg | default(false)

    - name: Decode the LinDeploy ownership marker
      ansible.builtin.set_fact:
        openshift_reset_ownership_data: >-
          {{ openshift_reset_ownership_content.content | b64decode | from_json }}
      when: openshift_reset_ownership_stat.stat.isreg | default(false)

    - name: Validate the protected LinDeploy ownership marker
      ansible.builtin.set_fact:
        openshift_reset_ownership_workshop_id: >-
          {{ (openshift_reset_ownership_data | default({})).get('workshop_id', '') }}
        openshift_reset_ownership_marker_matches: >-
          {{
            openshift_reset_ownership_stat.stat.isreg | default(false)
            and (openshift_reset_ownership_data | default({})).get('vm_name', '') == libvirt_vm_name
            and (openshift_reset_ownership_data | default({})).get('pool_name', '') == libvirt_pool_name
            and (openshift_reset_ownership_data | default({})).get('volume_name', '') == libvirt_volume_name
            and (openshift_reset_ownership_data | default({})).get('workshop_id', '')
                in ([workshop_id] + openshift_reset_accepted_legacy_workshop_ids)
          }}

    - name: Read managed SNO domain for ownership check
      ansible.builtin.command:
        argv: [virsh, --connect, "{{ libvirt_uri }}", dumpxml, "{{ libvirt_vm_name }}"]
      register: openshift_reset_domain
      changed_when: false
      failed_when: false

    - name: Refuse to reset an unmanaged domain
      ansible.builtin.assert:
        that:
          - >-
            openshift_reset_domain.rc != 0
            or workshop_id in openshift_reset_domain.stdout
            or (
              openshift_reset_ownership_marker_matches | bool
              and openshift_reset_ownership_workshop_id
                  in openshift_reset_domain.stdout
            )
            or 'sno-workshop' in openshift_reset_domain.stdout
            or 'lindeploy' in openshift_reset_domain.stdout
            or (openshift_reset_domain.rc == 0 and ('sno' in libvirt_vm_name or 'openshift' in libvirt_vm_name))
        fail_msg: >-
          The existing VM has neither the requested LinDeploy XML identity nor a
          protected ownership marker matching its VM, pool and volume. Fast reset
          was cancelled to prevent accidental data loss.
        quiet: true

    - name: Report accepted legacy ownership for reset
      ansible.builtin.debug:
        msg: >-
          Fast reset accepted legacy LinDeploy ownership identity
          {{ openshift_reset_ownership_workshop_id }} because the protected marker
          and domain XML agree on the requested VM, pool and volume.
      when:
        - openshift_reset_domain.rc == 0
        - openshift_reset_ownership_marker_matches | bool
        - openshift_reset_ownership_workshop_id != workshop_id

    # ── VM teardown ─────────────────────────────────────────────────────────────

    - name: Destroy running managed SNO domain
      ansible.builtin.command:
        argv: [virsh, --connect, "{{ libvirt_uri }}", destroy, "{{ libvirt_vm_name }}"]
      register: openshift_reset_destroy
      changed_when: openshift_reset_destroy.rc == 0
      failed_when: false
      when: openshift_reset_domain.rc == 0

    - name: Undefine managed SNO domain (with NVRAM if present)
      ansible.builtin.command:
        argv: >-
          {{
            ['virsh', '--connect', libvirt_uri, 'undefine', libvirt_vm_name]
            + (['--nvram'] if ('<nvram' in openshift_reset_domain.stdout or 'firmware' in openshift_reset_domain.stdout) else [])
          }}
      register: openshift_reset_undefine
      failed_when: false
      when: openshift_reset_domain.rc == 0

    - name: Retry undefining managed SNO domain without NVRAM flag if needed
      ansible.builtin.command:
        argv: [virsh, --connect, "{{ libvirt_uri }}", undefine, "{{ libvirt_vm_name }}"]
      register: openshift_reset_undefine_retry
      failed_when: false
      when:
        - openshift_reset_domain.rc == 0
        - openshift_reset_undefine.rc | default(0) != 0

    # ── Cluster volume reset ────────────────────────────────────────────────────

    - name: Check managed SNO volume
      ansible.builtin.command:
        argv: [virsh, --connect, "{{ libvirt_uri }}", vol-info, --pool, "{{ libvirt_pool_name }}", "{{ libvirt_volume_name }}"]
      register: openshift_reset_volume
      changed_when: false
      failed_when: false

    - name: Delete managed SNO volume
      ansible.builtin.command:
        argv: [virsh, --connect, "{{ libvirt_uri }}", vol-delete, --pool, "{{ libvirt_pool_name }}", "{{ libvirt_volume_name }}"]
      when: openshift_reset_volume.rc == 0

    - name: Remove orphaned NVRAM file if present
      ansible.builtin.file:
        path: "/var/lib/libvirt/qemu/nvram/{{ libvirt_vm_name }}_VARS.fd"
        state: absent

    # ── Transient runtime ISOs ──────────────────────────────────────────────────

    - name: Read storage pool definition for reset
      ansible.builtin.command:
        argv: [virsh, --connect, "{{ libvirt_uri }}", pool-dumpxml, "{{ libvirt_pool_name }}"]
      register: openshift_reset_pool_xml
      changed_when: false
      failed_when: false

    - name: Resolve runtime ISO paths for reset
      ansible.builtin.set_fact:
        openshift_reset_pool_path: >-
          {{
            (openshift_reset_pool_xml.stdout | regex_findall('<path>([^<]+)</path>') | first)
            if (openshift_reset_pool_xml.rc | default(1) == 0 and openshift_reset_pool_xml.stdout is search('<path>'))
            else '/home/libvirt/images'
          }}

    - name: Remove runtime agent ISO
      ansible.builtin.file:
        path: "{{ openshift_reset_pool_path }}/{{ libvirt_vm_name }}-agent.iso"
        state: absent

    - name: Remove static DHCP reservation from libvirt network
      ansible.builtin.command:
        argv:
          - virsh
          - --connect
          - "{{ libvirt_uri }}"
          - net-update
          - "{{ sno_host_request.libvirt_network | default('sno-workshop') }}"
          - delete
          - ip-dhcp-host
          - "<host mac='{{ sno_host_request.mac_address }}'/>"
          - --config
      failed_when: false
      when: sno_host_request.mac_address | default('') | length > 0

    # ── Transient ignition assets (keeps base ISO, mirror) ──────────────────────

    - name: Remove transient agent assets (ignition configs only, preserve base ISO)
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ openshift_agent_assets_directory }}/auth"
        - "{{ openshift_agent_assets_directory }}/agent-config.yaml"
        - "{{ openshift_agent_assets_directory }}/install-config.yaml"
        - "{{ openshift_agent_assets_directory }}/agent.x86_64.iso"
        - "{{ openshift_agent_assets_directory }}/agent.aarch64.iso"
      ignore_errors: true

    # ── Completion report ───────────────────────────────────────────────────────

    - name: Report fast reset completion
      ansible.builtin.debug:
        msg:
          - "================================================================="
          - "Fast Reset completed for cluster '{{ sno_request.cluster_name | default('sno-01') }}'."
          - "Removed: VM domain, disk volume, agent ISO, DHCP reservation."
          - "Preserved: storage pool, Quay mirror, base RHCOS ISO cache,"
          - "           ownership marker, kubeconfig template, .bashrc CLI hooks."
          - "The cluster can now be reinstalled from the LinDeploy UI."
          - "================================================================="
