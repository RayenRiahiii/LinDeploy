---
# ==================================================
# 1. Node Role Labeling and Membership Verification
# ==================================================

- name: Build expected K3s node list
  set_fact:
    k3s_multi_expected_nodes: >-
      {{
        groups.get('selected_hosts', [])
        | map('extract', hostvars, 'lindeploy_node_name')
        | list
        | sort
      }}

- name: Apply Kubernetes worker role labels to K3s agent nodes
  command:
    argv:
      - "{{ k3s_multi_validate_binary }}"
      - kubectl
      - "--kubeconfig={{ k3s_multi_validate_kubeconfig }}"
      - label
      - node
      - "{{ hostvars[item].lindeploy_node_name }}"
      - node-role.kubernetes.io/worker=worker
      - --overwrite
  loop: "{{ groups.get('workers', []) }}"
  register: k3s_multi_worker_labels
  changed_when: "' not labeled' not in k3s_multi_worker_labels.stdout"

- name: Wait for every K3s node to become Ready
  command: >-
    {{ k3s_multi_validate_binary }} kubectl --kubeconfig={{ k3s_multi_validate_kubeconfig }}
    wait --for=condition=Ready nodes --all --timeout={{ k3s_multi_validate_timeout }}
  changed_when: false

- name: Read installed K3s nodes
  command: >-
    {{ k3s_multi_validate_binary }} kubectl --kubeconfig={{ k3s_multi_validate_kubeconfig }}
    --request-timeout={{ k3s_multi_validate_request_timeout }} get nodes -o json
  register: k3s_multi_nodes_json
  changed_when: false

- name: Verify every selected host joined the K3s cluster
  vars:
    k3s_multi_actual_nodes: >-
      {{
        (k3s_multi_nodes_json.stdout | from_json)['items']
        | map(attribute='metadata.name')
        | list
        | sort
      }}
  assert:
    that:
      - k3s_multi_expected_nodes | difference(k3s_multi_actual_nodes) | length == 0
      - k3s_multi_actual_nodes | difference(k3s_multi_expected_nodes) | length == 0
    fail_msg: >-
      Cluster membership differs from the selected inventory.
      Expected: {{ k3s_multi_expected_nodes | join(', ') }}.
      Actual: {{ k3s_multi_actual_nodes | join(', ') }}.

# ==================================================
# 2. Workload and Component Rollout Checks
# ==================================================

- name: Wait for CoreDNS deployment rollout
  command: >-
    {{ k3s_multi_validate_binary }} kubectl --kubeconfig={{ k3s_multi_validate_kubeconfig }}
    -n kube-system rollout status deploy/coredns --timeout={{ k3s_multi_validate_timeout }}
  changed_when: false
  when: k3s_multi_validate_coredns | bool

- name: Wait for local-path-provisioner deployment rollout
  command: >-
    {{ k3s_multi_validate_binary }} kubectl --kubeconfig={{ k3s_multi_validate_kubeconfig }}
    -n kube-system rollout status deploy/local-path-provisioner --timeout={{ k3s_multi_validate_timeout }}
  changed_when: false
  when: k3s_multi_validate_local_path_provisioner | bool

- name: Wait for metrics-server deployment rollout
  command: >-
    {{ k3s_multi_validate_binary }} kubectl --kubeconfig={{ k3s_multi_validate_kubeconfig }}
    -n kube-system rollout status deploy/metrics-server --timeout={{ k3s_multi_validate_timeout }}
  changed_when: false
  when: k3s_multi_validate_metrics_server | bool

- name: Wait for K3s Helm install jobs to complete
  command: >-
    {{ k3s_multi_validate_binary }} kubectl --kubeconfig={{ k3s_multi_validate_kubeconfig }}
    -n kube-system wait --for=condition=complete job --all --timeout={{ k3s_multi_validate_timeout }}
  register: k3s_multi_helm_jobs_wait
  changed_when: false
  failed_when: false

- name: Wait for Traefik deployment rollout
  command: >-
    {{ k3s_multi_validate_binary }} kubectl --kubeconfig={{ k3s_multi_validate_kubeconfig }}
    -n kube-system rollout status deploy/traefik --timeout={{ k3s_multi_validate_timeout }}
  changed_when: false
  failed_when: false
  when:
    - k3s_multi_validate_traefik | bool
    - "'traefik' not in (k3s_disable_components | default([]))"

- name: Check Kubernetes API readiness probe
  command: >-
    {{ k3s_multi_validate_binary }} kubectl --kubeconfig={{ k3s_multi_validate_kubeconfig }}
    --request-timeout={{ k3s_multi_validate_request_timeout }} get --raw=/readyz
  register: k3s_multi_readyz_result
  changed_when: false
  failed_when: k3s_multi_readyz_result.stdout | trim != 'ok'

- name: Ensure all cluster pods are healthy
  command: >-
    {{ k3s_multi_validate_binary }} kubectl --kubeconfig={{ k3s_multi_validate_kubeconfig }}
    --request-timeout={{ k3s_multi_validate_request_timeout }}
    get pods -A --no-headers
  register: k3s_multi_all_pods_health
  changed_when: false
  retries: 30
  delay: 5
  until: >-
    k3s_multi_all_pods_health.rc == 0
    and
    (
      k3s_multi_all_pods_health.stdout_lines
      | reject('search', '^kube-system\s+helm-install-')
      | select('search', '\s(Error|CrashLoopBackOff|ImagePullBackOff|ErrImagePull|CreateContainerConfigError|Pending|Unknown|Failed)\s')
      | list
      | length
    ) == 0

# ==================================================
# 3. Capture Cluster Summaries
# ==================================================

- name: Capture cluster node summary
  command: >-
    {{ k3s_multi_validate_binary }} kubectl --kubeconfig={{ k3s_multi_validate_kubeconfig }}
    --request-timeout={{ k3s_multi_validate_request_timeout }} get nodes -o wide
  register: k3s_multi_cluster_nodes_summary
  changed_when: false

- name: Capture cluster pod summary
  command: >-
    {{ k3s_multi_validate_binary }} kubectl --kubeconfig={{ k3s_multi_validate_kubeconfig }}
    --request-timeout={{ k3s_multi_validate_request_timeout }} get pods -A -o wide
  register: k3s_multi_cluster_pods_summary
  changed_when: false

- name: Display K3s multi-node cluster status
  debug:
    msg: |
      === K3S MULTI-NODE CLUSTER READY ===
      Nodes:
      {{ k3s_multi_cluster_nodes_summary.stdout }}

      Pods:
      {{ k3s_multi_cluster_pods_summary.stdout }}

- name: Mark K3s cluster validation complete
  set_fact:
    lindeploy_k3s_cluster_validated: true
