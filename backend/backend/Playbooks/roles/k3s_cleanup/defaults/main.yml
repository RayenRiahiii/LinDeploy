---
k3s_cleanup_service_name: k3s
k3s_cleanup_service_stop_retries: 12
k3s_cleanup_service_stop_delay: 5
k3s_cleanup_connection_recovery_timeout: 90
k3s_cleanup_connection_recovery_connect_timeout: 5
k3s_cleanup_connection_recovery_sleep: 3
k3s_cleanup_uninstall_timeout: 180
k3s_cleanup_uninstall_poll_interval: 5
k3s_cleanup_binary_path: /usr/local/bin/k3s
k3s_cleanup_kubectl_wrapper_path: /usr/local/bin/kubectl
k3s_cleanup_uninstall_script_path: /usr/local/bin/k3s-uninstall.sh
k3s_cleanup_killall_script_path: /usr/local/bin/k3s-killall.sh
k3s_cleanup_service_unit_path: /etc/systemd/system/k3s.service
k3s_cleanup_service_env_path: /etc/systemd/system/k3s.service.env
k3s_cleanup_service_wants_path: /etc/systemd/system/multi-user.target.wants/k3s.service

k3s_cleanup_root_kube_dir: /root/.kube
k3s_cleanup_root_kubeconfig_path: /root/.kube/config
k3s_cleanup_remote_user_shell_rc_path: .bashrc
k3s_cleanup_cni_config_dir: /etc/cni/net.d

k3s_cleanup_state_paths:
  - /etc/rancher/k3s
  - /var/lib/rancher/k3s
  - /var/lib/kubelet
  - /var/lib/cni
  - /run/flannel
  - /var/lib/calico

k3s_cleanup_project_file_paths:
  - "{{ k3s_cleanup_service_unit_path }}"
  - "{{ k3s_cleanup_service_env_path }}"
  - "{{ k3s_cleanup_service_wants_path }}"
  - "{{ k3s_cleanup_binary_path }}"
  - "{{ k3s_cleanup_uninstall_script_path }}"
  - "{{ k3s_cleanup_killall_script_path }}"

k3s_cleanup_interface_regex: >-
  ^(cni0|flannel\.1|flannel-wg|vxlan\.flannel|flannel.*|kube-ipvs0)$

k3s_cleanup_remove_kubectl_wrapper: true
k3s_cleanup_remove_remote_user_shell_env: true
k3s_cleanup_prune_empty_kube_dirs: true
k3s_cleanup_fail_when_uninstall_helper_fails: false

k3s_cleanup_manage_firewalld_rules: "{{ ansible_facts['os_family'] == 'RedHat' }}"
k3s_cleanup_firewalld_zone: "{{ common_firewalld_zone | default('public') }}"
k3s_cleanup_firewalld_trusted_zone: "{{ common_firewalld_trusted_zone | default('trusted') }}"
k3s_cleanup_firewalld_ports:
  - 6443/tcp
  - 10250/tcp
  - 8472/udp
  - 51820/udp
k3s_cleanup_firewalld_trusted_sources:
  - 10.42.0.0/16
  - 10.43.0.0/16
