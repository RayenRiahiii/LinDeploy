---
- name: Validate requested Kubernetes node role
  assert:
    that:
      - kubeadm_multi_join_role in ['control_plane', 'worker']
      - groups.get('bootstrap', []) | length == 1
      - kubeadm_multi_join_node_name | length > 0
    fail_msg: "The node role, node name, or bootstrap inventory group is invalid."

- name: Resolve bootstrap host and endpoint
  set_fact:
    kubeadm_multi_join_bootstrap_host: "{{ groups['bootstrap'][0] }}"
    kubeadm_multi_join_endpoint: >-
      {{
        hostvars[groups['bootstrap'][0]].kubeadm_multi_effective_endpoint
        | default(control_plane_endpoint | default(''))
      }}

- name: Validate control-plane endpoint
  assert:
    that:
      - kubeadm_multi_join_endpoint | length > 0
    fail_msg: "No control-plane endpoint was generated by the bootstrap host."

- name: Inspect node-local resolver configuration
  stat:
    path: "{{ item }}"
  loop: "{{ kubeadm_multi_join_resolver_candidates }}"
  register: kubeadm_multi_join_resolver_files

- name: Select node-local kubelet resolver
  set_fact:
    kubeadm_multi_join_resolv_conf: >-
      {{
        kubeadm_multi_join_resolver_files.results
        | selectattr('stat.exists')
        | map(attribute='item')
        | first
        | default('')
      }}

- name: Require a usable node-local resolver
  assert:
    that:
      - kubeadm_multi_join_resolv_conf | length > 0
    fail_msg: >-
      No usable resolver configuration was found on {{ inventory_hostname }}.
      Checked: {{ kubeadm_multi_join_resolver_candidates | join(', ') }}.
      Restore the operating system DNS configuration before joining this node.

- name: Inspect existing Kubernetes node state
  stat:
    path: "{{ item }}"
  loop:
    - "{{ kubeadm_multi_join_kubelet_conf_path }}"
    - "{{ kubeadm_multi_join_admin_conf_path }}"
    - /etc/kubernetes/pki/ca.crt
  register: kubeadm_multi_join_state

- name: Find static pod manifests from a partial join
  find:
    paths: /etc/kubernetes/manifests
    patterns: "*.yaml"
    file_type: file
  register: kubeadm_multi_join_manifests
  when: not kubeadm_multi_join_state.results[0].stat.exists

- name: Refuse ambiguous partial Kubernetes state
  fail:
    msg: >-
      Partial Kubernetes state exists on {{ inventory_hostname }} without a
      valid kubelet.conf. Run the Kubernetes reset cleanup for this host before
      retrying. No automatic destructive reset was run.
  when:
    - not kubeadm_multi_join_state.results[0].stat.exists
    - >-
      kubeadm_multi_join_state.results[2].stat.exists
      or (kubeadm_multi_join_manifests.matched | default(0) | int > 0)

- name: Read existing kubelet configuration
  slurp:
    path: "{{ kubeadm_multi_join_kubelet_conf_path }}"
  register: kubeadm_multi_existing_kubelet_conf
  when: kubeadm_multi_join_state.results[0].stat.exists

- name: Verify existing node belongs to requested cluster
  vars:
    kubeadm_multi_existing_join_server: >-
      {{
        kubeadm_multi_existing_kubelet_conf.content
        | b64decode
        | regex_findall('server: https://([^/\s]+)')
        | first
        | default('')
      }}
  assert:
    that:
      - kubeadm_multi_existing_join_server == kubeadm_multi_join_endpoint
      - >-
        kubeadm_multi_join_role != 'control_plane'
        or kubeadm_multi_join_state.results[1].stat.exists
    fail_msg: >-
      Existing Kubernetes node state on {{ inventory_hostname }} does not match
      the requested cluster endpoint or role. Reset this node before retrying.
  when: kubeadm_multi_join_state.results[0].stat.exists

- name: Read existing cluster node identities for joined host
  command:
    argv:
      - kubectl
      - "--kubeconfig={{ kubeadm_multi_join_admin_conf_path }}"
      - get
      - nodes
      - '-o=jsonpath={range .items[*]}{.metadata.name}{"="}{range .status.addresses[?(@.type=="InternalIP")]}{.address}{end}{"\n"}{end}'
  register: kubeadm_multi_join_existing_node_identities
  changed_when: false
  failed_when: false
  delegate_to: "{{ kubeadm_multi_join_bootstrap_host }}"
  when: kubeadm_multi_join_state.results[0].stat.exists

- name: Resolve joined node identity by internal address
  set_fact:
    kubeadm_multi_join_existing_identity_lines: >-
      {{
        kubeadm_multi_join_existing_node_identities.stdout_lines
        | default([])
        | select('match', '^.+=' ~ (kubeadm_multi_join_advertise_address | regex_escape) ~ '$')
        | list
      }}
  when: kubeadm_multi_join_state.results[0].stat.exists

- name: Verify existing joined node name
  assert:
    that:
      - kubeadm_multi_join_existing_node_identities.rc == 0
      - kubeadm_multi_join_existing_identity_lines | length == 1
      - >-
        (kubeadm_multi_join_existing_identity_lines | first).split('=', 1)[0]
        == kubeadm_multi_join_node_name
    fail_msg: >-
      Existing Kubernetes cluster identity does not match the requested
      configuration. The node at {{ kubeadm_multi_join_advertise_address }} is
      registered as '{{ ((kubeadm_multi_join_existing_identity_lines | first | default('=' )).split('=', 1)[0]) }}',
      but LinDeploy requested '{{ kubeadm_multi_join_node_name }}'. Kubernetes node
      names cannot be renamed safely in place. Run Reset Cluster on the affected
      Kubernetes targets, then launch the installation with the new names.
  when: kubeadm_multi_join_state.results[0].stat.exists

- name: Wait for Kubernetes API endpoint from joining node
  wait_for:
    host: "{{ kubeadm_multi_join_endpoint | regex_replace(':[0-9]+$', '') }}"
    port: "{{ kubeadm_multi_join_endpoint | regex_search('[0-9]+$') | int }}"
    timeout: "{{ kubeadm_multi_join_api_timeout }}"
    delay: 3
  when: not kubeadm_multi_join_state.results[0].stat.exists

- name: Select secure ephemeral join command
  set_fact:
    kubeadm_multi_selected_join_command: >-
      {{
        hostvars[kubeadm_multi_join_bootstrap_host].kubeadm_multi_control_plane_join_command
        if kubeadm_multi_join_role == 'control_plane'
        else hostvars[kubeadm_multi_join_bootstrap_host].kubeadm_multi_worker_join_command
      }}
  no_log: true
  when: not kubeadm_multi_join_state.results[0].stat.exists

- name: Validate secure join command
  assert:
    that:
      - kubeadm_multi_selected_join_command is search('--discovery-token-ca-cert-hash sha256:')
      - >-
        kubeadm_multi_join_role != 'control_plane'
        or kubeadm_multi_selected_join_command is search('--certificate-key [a-f0-9]{64}')
    fail_msg: "The bootstrap host did not provide a valid secure join command."
  no_log: true
  when: not kubeadm_multi_join_state.results[0].stat.exists

- name: Join node to Kubernetes cluster
  block:
    - name: Run secure kubeadm join
      command: >-
        {{ kubeadm_multi_selected_join_command }}
        --node-name {{ kubeadm_multi_join_node_name }}
        --cri-socket {{ kubeadm_multi_join_cri_socket }}
      async: "{{ kubeadm_multi_join_timeout }}"
      poll: "{{ kubeadm_multi_join_poll_interval }}"
      no_log: true
  rescue:
    - name: Capture join service diagnostics
      command:
        argv:
          - journalctl
          - -u
          - kubelet
          - -u
          - containerd
          - -n
          - "80"
          - --no-pager
      register: kubeadm_multi_join_diagnostics
      changed_when: false
      failed_when: false

    - name: Fail with sanitized join diagnostics
      fail:
        msg: |-
          kubeadm join failed on {{ inventory_hostname }} for role
          {{ kubeadm_multi_join_role }}. Join credentials were redacted.
          Service diagnostics:
          {{ kubeadm_multi_join_diagnostics.stdout | default('unavailable') }}
  when: not kubeadm_multi_join_state.results[0].stat.exists

- name: Configure kubelet with the node-local resolver
  lineinfile:
    path: "{{ kubeadm_multi_join_kubelet_config_path }}"
    regexp: '^resolvConf:'
    line: "resolvConf: {{ kubeadm_multi_join_resolv_conf }}"
    state: present
  notify: Restart kubelet after resolver change

- name: Apply node-local kubelet resolver configuration
  meta: flush_handlers

- name: Wait for kubelet to become active
  command: systemctl is-active kubelet
  register: kubeadm_multi_kubelet_active
  changed_when: false
  retries: 12
  delay: 5
  until: kubeadm_multi_kubelet_active.rc == 0
