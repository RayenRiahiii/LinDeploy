---
containerd_package_name_redhat: containerd.io
containerd_package_name_debian: containerd.io
containerd_service_name: containerd
containerd_config_path: /etc/containerd/config.toml
containerd_socket_path: /run/containerd/containerd.sock

containerd_repo_distribution_path: "centos/{{ ansible_facts['distribution_major_version'] }}"
containerd_repo_name: docker-ce-stable
containerd_repo_description: Docker CE Stable
containerd_repo_baseurl: "https://download.docker.com/linux/{{ containerd_repo_distribution_path }}/$basearch/stable"
containerd_repo_gpgkey: https://download.docker.com/linux/centos/gpg

containerd_apt_repo_url: "https://download.docker.com/linux/{{ ansible_facts['distribution'] | lower }}"
containerd_apt_repo_distribution: "{{ ansible_facts['distribution_release'] }}"
containerd_apt_repo_components: stable
containerd_apt_keyring_dir: /etc/apt/keyrings
containerd_apt_keyring_path: /etc/apt/keyrings/docker.asc
containerd_apt_key_refresh_max_age_seconds: 2592000
containerd_apt_cache_valid_time: 3600
containerd_apt_lock_timeout: 120
containerd_redhat_update_cache: false
