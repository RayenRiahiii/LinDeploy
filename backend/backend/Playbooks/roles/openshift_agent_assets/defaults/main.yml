---
openshift_mirror_tools_directory: /usr/local/libexec/lindeploy-openshift
openshift_mirror_workspace: /var/lib/lindeploy/oc-mirror
openshift_mirror_state_directory: /var/lib/lindeploy/openshift-mirror-state
openshift_mirror_auth_file: "{{ openshift_mirror_state_directory }}/auth.json"
openshift_mirror_quay_root: /opt/quay
openshift_agent_assets_root: /var/lib/lindeploy/openshift-agent
openshift_agent_assets_directory: "{{ openshift_agent_assets_root }}/{{ cluster_name }}"
openshift_agent_install_config: "{{ openshift_agent_assets_directory }}/install-config.yaml"
openshift_agent_config: "{{ openshift_agent_assets_directory }}/agent-config.yaml"
openshift_agent_iso_path: "{{ openshift_agent_assets_directory }}/agent.{{ cpu_architecture }}.iso"
openshift_agent_state_path: "{{ openshift_agent_assets_directory }}/.openshift_install_state.json"
openshift_agent_fingerprint_path: "{{ openshift_agent_assets_directory }}/.lindeploy-request.sha256"
openshift_agent_ready_file: "{{ openshift_mirror_state_directory }}/{{ openshift_version }}-{{ cpu_architecture }}.json"
openshift_agent_release_image_repository: openshift/release-images
openshift_agent_machine_os_repository: openshift/release
openshift_agent_base_iso_cache_directory: /root/.cache/agent/image_cache
openshift_agent_base_iso_cache_path: "{{ openshift_agent_base_iso_cache_directory }}/coreos-x86_64.iso"
openshift_agent_base_iso_digest_path: "{{ openshift_agent_base_iso_cache_directory }}/.lindeploy-machine-os.digest"
openshift_agent_base_iso_override_url: http://127.0.0.1:9/coreos-x86_64.iso
openshift_agent_image_generation_timeout_seconds: 1800
