---
- name: Publish safe cleanup decision
  ansible.builtin.set_fact:
    lindeploy_cleanup_required: >-
      {{
        (not lindeploy_ownership_manifest_stat.stat.exists)
        or (lindeploy_ownership_existing.state | default('') != 'cleaned')
      }}
    lindeploy_platform_state: "{{ lindeploy_ownership_existing.state | default('unregistered') }}"

