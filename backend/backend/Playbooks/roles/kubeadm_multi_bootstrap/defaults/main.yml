---
kubeadm_multi_node_name: "{{ lindeploy_node_name | default(ansible_facts['hostname'] | lower) }}"
kubeadm_multi_cluster_name: "{{ cluster_name | default('kubernetes') }}"
kubeadm_multi_advertise_address: "{{ lindeploy_advertise_address | default(ansible_facts['default_ipv4']['address']) }}"
kubeadm_multi_control_plane_endpoint: "{{ control_plane_endpoint | default('') }}"

kubeadm_multi_init_config_path: /etc/kubernetes/kubeadm-multi-init.yaml
kubeadm_multi_admin_conf_path: /etc/kubernetes/admin.conf
kubeadm_multi_kubelet_conf_path: /etc/kubernetes/kubelet.conf
kubeadm_multi_cri_socket: unix:///run/containerd/containerd.sock
kubeadm_multi_api_port: 6443
kubeadm_multi_api_bind_wait_timeout: 20

kubeadm_multi_pod_network_cidr: "{{ pod_cidr | default('172.16.0.0/16') }}"
kubeadm_multi_service_cidr: "{{ service_cidr | default('10.96.0.0/12') }}"
kubeadm_multi_cluster_domain: "{{ cluster_domain | default('cluster.local') }}"
kubeadm_multi_image_repository: ""
kubeadm_multi_kubernetes_version: "{{ '' if (version | default('stable')) == 'stable' else version }}"

kubeadm_multi_images_pull_mode: missing
kubeadm_multi_images_pull_retries: 2
kubeadm_multi_images_pull_retry_delay: 10
kubeadm_multi_image_pull_timeout: 600
kubeadm_multi_image_pull_poll_interval: 5
kubeadm_multi_init_timeout: 600
kubeadm_multi_init_poll_interval: 5
kubeadm_multi_join_token_ttl: 1h

kubeadm_multi_root_kubeconfig_dir: /root/.kube
kubeadm_multi_root_kubeconfig_path: /root/.kube/config
kubeadm_multi_copy_kubeconfig_to_remote_user: true
kubeadm_multi_manage_kubectl_compat_symlink: true
kubeadm_multi_kubectl_binary_path: /usr/bin/kubectl
kubeadm_multi_kubectl_compat_symlink_path: /usr/local/bin/kubectl
