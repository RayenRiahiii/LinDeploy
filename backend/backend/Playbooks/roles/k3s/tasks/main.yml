---
# ==================================================
# 1. Prechecks and current state
# ==================================================

- name: Validate minimum server requirements
  assert:
    that:
      - (ansible_facts['processor_vcpus'] | default(ansible_facts['processor_nproc'] | default(0)) | int) >= (k3s_min_server_vcpus | int)
      - (ansible_facts['memtotal_mb'] | int) >= (k3s_min_server_memory_mb | int)
    fail_msg: >-
      {{ inventory_hostname }} does not meet the minimum K3s server requirements.
      Required: {{ k3s_min_server_vcpus }} vCPU and {{ k3s_min_server_memory_mb }} MB RAM.
      Detected: {{ ansible_facts['processor_vcpus'] | default(ansible_facts['processor_nproc'] | default(0)) }} vCPU and {{ ansible_facts['memtotal_mb'] }} MB RAM.
  when: k3s_enforce_minimum_requirements | bool

- name: Check K3s binary
  stat:
    path: "{{ k3s_binary_path }}"
  register: k3s_binary_stat

- name: Check K3s service unit
  stat:
    path: "{{ k3s_service_unit_path }}"
  register: k3s_service_unit_stat

- name: Check K3s kubeconfig
  stat:
    path: "{{ k3s_kubeconfig_path }}"
  register: k3s_kubeconfig_stat

- name: Check K3s uninstall helper
  stat:
    path: "{{ k3s_uninstall_script_path }}"
  register: k3s_uninstall_script_stat

- name: Check K3s killall helper
  stat:
    path: "{{ k3s_killall_script_path }}"
  register: k3s_killall_script_stat

- name: Decide whether installed K3s version must be checked
  set_fact:
    k3s_installed_version_check_required: "{{ k3s_binary_stat.stat.exists and (k3s_version | length > 0) }}"

- name: Get installed K3s version
  command: "{{ k3s_binary_path }} --version"
  register: k3s_version_output
  changed_when: false
  failed_when: false
  when: k3s_installed_version_check_required | bool

- name: Extract installed K3s version
  set_fact:
    k3s_installed_version: "{{ k3s_version_output.stdout_lines[0].split(' ')[2] }}"
  when:
    - k3s_installed_version_check_required | bool
    - k3s_version_output.rc == 0
    - k3s_version_output.stdout_lines | length > 0

- name: Determine whether K3s installation artifacts already exist
  set_fact:
    k3s_existing_install_detected: >-
      {{
        k3s_binary_stat.stat.exists
        or k3s_service_unit_stat.stat.exists
        or k3s_kubeconfig_stat.stat.exists
      }}

- name: Check current K3s service active state
  command: "systemctl is-active {{ k3s_service_name }}"
  register: k3s_existing_service_active_result
  changed_when: false
  failed_when: false
  when: k3s_service_unit_stat.stat.exists

- name: Check current K3s service enabled state
  command: "systemctl is-enabled {{ k3s_service_name }}"
  register: k3s_existing_service_enabled_result
  changed_when: false
  failed_when: false
  when: k3s_service_unit_stat.stat.exists

- name: Probe existing K3s API readiness
  command: >-
    {{ k3s_binary_path }} kubectl --kubeconfig={{ k3s_kubeconfig_path }}
    --request-timeout={{ k3s_kubectl_request_timeout }} get --raw=/readyz
  register: k3s_existing_readyz_result
  changed_when: false
  failed_when: false
  retries: "{{ k3s_existing_install_api_probe_retries }}"
  delay: "{{ k3s_existing_install_api_probe_delay }}"
  until: k3s_existing_readyz_result.rc == 0 and 'ok' in k3s_existing_readyz_result.stdout
  when:
    - k3s_existing_install_detected | bool
    - k3s_existing_install_api_probe | bool
    - k3s_binary_stat.stat.exists
    - k3s_service_unit_stat.stat.exists
    - k3s_kubeconfig_stat.stat.exists
    - k3s_existing_service_active_result.stdout | default('') == 'active'

- name: Compute primary K3s installation state flags
  set_fact:
    k3s_existing_install_structurally_complete: >-
      {{
        (k3s_existing_install_detected | bool)
        and k3s_binary_stat.stat.exists
        and k3s_service_unit_stat.stat.exists
        and k3s_kubeconfig_stat.stat.exists
      }}
    k3s_existing_service_active: "{{ k3s_existing_service_active_result.stdout | default('') == 'active' }}"
    k3s_existing_service_enabled: "{{ k3s_existing_service_enabled_result.stdout | default('') == 'enabled' }}"
    k3s_existing_install_readyz_ok: >-
      {{
        (not (k3s_existing_install_api_probe | bool))
        or
        (
          (k3s_existing_readyz_result.rc | default(1)) == 0
          and 'ok' in (k3s_existing_readyz_result.stdout | default(''))
        )
      }}

- name: Compute derived K3s installation state flags
  set_fact:
    k3s_incomplete_install_detected: >-
      {{
        (k3s_existing_install_detected | bool)
        and not (k3s_existing_install_structurally_complete | bool)
      }}
    k3s_existing_install_healthy: >-
      {{
        (k3s_existing_install_structurally_complete | bool)
        and (k3s_existing_service_active | bool)
        and (k3s_existing_install_readyz_ok | bool)
      }}

- name: Determine whether K3s installation is required
  set_fact:
    k3s_install_required: >-
      {{
        (not (k3s_existing_install_detected | bool))
        or
        (k3s_remediate_incomplete_install | bool and k3s_incomplete_install_detected)
        or
        (
          (k3s_version | length > 0)
          and
          (k3s_installed_version | default('') != k3s_version)
        )
      }}

- name: Remediate incomplete existing K3s installation
  block:
    - name: Stop stale K3s service before reinstall
      systemd_service:
        name: "{{ k3s_service_name }}"
        state: stopped
        enabled: false
      failed_when: false

    - name: Run K3s uninstall helper for stale install
      command: "{{ k3s_uninstall_script_path }}"
      when: k3s_uninstall_script_stat.stat.exists

    - name: Run K3s killall helper when uninstall helper is absent
      command: "{{ k3s_killall_script_path }}"
      when:
        - not k3s_uninstall_script_stat.stat.exists
        - k3s_killall_script_stat.stat.exists

    - name: Remove stale K3s state before reinstall
      file:
        path: "{{ item }}"
        state: absent
      loop: >-
        {{
          (
            k3s_stale_install_cleanup_paths
            + k3s_stale_install_remove_paths
            + ([k3s_kubectl_wrapper_path] if (k3s_manage_kubectl_wrapper | bool) else [])
          ) | unique
        }}

    - name: Reload systemd after stale K3s cleanup
      command: systemctl daemon-reload
      changed_when: false
  when:
    - k3s_remediate_incomplete_install | bool
    - k3s_incomplete_install_detected | bool

- name: Read listeners that already occupy the K3s API port
  command: ss -lntpH
  register: k3s_listener_snapshot
  changed_when: false
  failed_when: false
  when: k3s_install_required | bool

- name: Track conflicting listeners on required K3s ports
  set_fact:
    k3s_required_port_conflicts: >-
      {{
        k3s_listener_snapshot.stdout_lines
        | select('search', ':(' ~ (k3s_required_listen_ports | map('string') | join('|')) ~ ')\\s')
        | list
      }}
  when: k3s_install_required | bool

- name: Fail when required K3s ports are already occupied before startup
  fail:
    msg: >-
      K3s cannot start on {{ inventory_hostname }} because one or more required
      ports are already in use: {{ k3s_required_listen_ports | join(', ') }}.
      Existing listeners: {{ k3s_required_port_conflicts | join(' || ') }}.
      Clean the previous control plane completely before installing K3s.
  when:
    - k3s_install_required | bool
    - k3s_required_port_conflicts | length > 0

- name: Compute expected packaged component state
  set_fact:
    k3s_coredns_expected: "{{ k3s_validate_coredns | bool and ('coredns' not in k3s_disable_components) }}"
    k3s_local_path_expected: "{{ k3s_validate_local_path_provisioner | bool and ('local-storage' not in k3s_disable_components) }}"
    k3s_metrics_server_expected: "{{ k3s_validate_metrics_server | bool and ('metrics-server' not in k3s_disable_components) }}"

- name: Compute effective SELinux setting for K3s
  set_fact:
    k3s_effective_selinux_enabled: >-
      {{
        (k3s_enable_selinux | bool)
        and
        (
          ansible_facts.get('selinux', {}).get('status', 'disabled') != 'disabled'
        )
      }}

- name: Skip K3s SELinux integration on hosts where SELinux is unavailable
  debug:
    msg: >-
      K3s SELinux integration is disabled on {{ inventory_hostname }} because
      SELinux is not active on this host.
  changed_when: false
  when:
    - k3s_enable_selinux | bool
    - not (k3s_effective_selinux_enabled | bool)

- name: Build effective K3s configuration data
  set_fact:
    k3s_config_data: >-
      {{
        {
          'write-kubeconfig-mode': k3s_write_kubeconfig_mode,
          'node-name': k3s_node_name
        }
        | combine({'selinux': true} if (k3s_effective_selinux_enabled | bool) else {})
        | combine({'disable': k3s_disable_components} if k3s_disable_components | length > 0 else {})
        | combine({'node-label': k3s_node_labels} if k3s_node_labels | length > 0 else {})
        | combine({'node-taint': k3s_node_taints} if k3s_node_taints | length > 0 else {})
        | combine({'tls-san': k3s_tls_sans} if k3s_tls_sans | length > 0 else {})
        | combine({'system-default-registry': k3s_system_default_registry} if k3s_system_default_registry | length > 0 else {})
        | combine({'cluster-cidr': k3s_cluster_cidr} if k3s_cluster_cidr | length > 0 else {})
        | combine({'service-cidr': k3s_service_cidr} if k3s_service_cidr | length > 0 else {})
        | combine({'flannel-backend': k3s_flannel_backend} if k3s_flannel_backend | length > 0 else {})
        | combine({'token': k3s_token} if k3s_token | length > 0 else {})
        | combine(k3s_extra_config, recursive=True)
      }}

- name: Compute effective firewalld ports
  set_fact:
    k3s_effective_firewalld_ports: >-
      {{
        (
          k3s_firewalld_ports
          +
          (
            k3s_firewalld_flannel_ports[k3s_flannel_backend]
            if k3s_flannel_backend in k3s_firewalld_flannel_ports
            else k3s_firewalld_flannel_ports['vxlan']
          )
        ) | unique
      }}
  when: k3s_manage_firewalld_rules | bool

# ==================================================
# 2. Host firewall for K3s
# ==================================================

- name: Check K3s firewalld ports
  command: "firewall-cmd --permanent --zone={{ k3s_firewalld_zone }} --query-port={{ item }}"
  register: k3s_firewalld_port_queries
  changed_when: false
  failed_when: false
  loop: "{{ k3s_effective_firewalld_ports | default([]) }}"
  when:
    - k3s_manage_firewalld_rules | bool
    - common_manage_firewalld | default(true) | bool
    - common_firewalld_state | default('started') != 'stopped'

- name: Add K3s firewalld ports
  command: "firewall-cmd --permanent --zone={{ k3s_firewalld_zone }} --add-port={{ item.item }}"
  loop: "{{ k3s_firewalld_port_queries.results | default([]) }}"
  when:
    - k3s_manage_firewalld_rules | bool
    - common_manage_firewalld | default(true) | bool
    - common_firewalld_state | default('started') != 'stopped'
    - item.rc is defined
    - item.rc != 0
  changed_when: true
  notify: Reload firewalld

- name: Check K3s trusted firewalld source CIDRs
  command: "firewall-cmd --permanent --zone={{ k3s_firewalld_trusted_zone }} --query-source={{ item }}"
  register: k3s_firewalld_source_queries
  changed_when: false
  failed_when: false
  loop: "{{ k3s_firewalld_trusted_sources }}"
  when:
    - k3s_manage_firewalld_rules | bool
    - common_manage_firewalld | default(true) | bool
    - common_firewalld_state | default('started') != 'stopped'

- name: Add K3s trusted firewalld source CIDRs
  command: "firewall-cmd --permanent --zone={{ k3s_firewalld_trusted_zone }} --add-source={{ item.item }}"
  loop: "{{ k3s_firewalld_source_queries.results | default([]) }}"
  when:
    - k3s_manage_firewalld_rules | bool
    - common_manage_firewalld | default(true) | bool
    - common_firewalld_state | default('started') != 'stopped'
    - item.rc is defined
    - item.rc != 0
  changed_when: true
  notify: Reload firewalld

# ==================================================
# 3. K3s configuration
# ==================================================

- name: Ensure K3s config directory exists
  file:
    path: "{{ k3s_config_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Render K3s config file
  template:
    src: config.yaml.j2
    dest: "{{ k3s_config_path }}"
    owner: root
    group: root
    mode: "0600"
  no_log: "{{ k3s_hide_sensitive_config | bool }}"
  register: k3s_config_result
  notify: Restart k3s

- name: Render private registry configuration
  template:
    src: registries.yaml.j2
    dest: "{{ k3s_registries_config_path }}"
    owner: root
    group: root
    mode: "0600"
  no_log: "{{ k3s_hide_sensitive_config | bool }}"
  register: k3s_registries_result
  when: k3s_registries | length > 0
  notify: Restart k3s

- name: Remove private registry configuration when not used
  file:
    path: "{{ k3s_registries_config_path }}"
    state: absent
  register: k3s_registries_absent_result
  when: k3s_registries | length == 0
  notify: Restart k3s

- name: Set restart requirement for existing K3s install
  set_fact:
    k3s_restart_required: >-
      {{
        (not k3s_install_required | bool)
        and
        k3s_binary_stat.stat.exists
        and
        (
          k3s_config_result.changed
          or (k3s_registries_result is defined and k3s_registries_result.changed)
          or (k3s_registries_absent_result is defined and k3s_registries_absent_result.changed)
        )
      }}

- name: Compute effective K3s healthcheck depth
  set_fact:
    k3s_deep_healthcheck_required: >-
      {{
        (k3s_install_required | bool)
        or (k3s_restart_required | default(false) | bool)
        or (k3s_validate_existing_install_deep | bool)
      }}
    k3s_wait_for_startup_artifacts_required: >-
      {{
        (k3s_install_required | bool)
        or (k3s_restart_required | default(false) | bool)
        or not (k3s_existing_install_structurally_complete | default(false) | bool)
      }}
    k3s_service_state_enforcement_required: >-
      {{
        (k3s_install_required | bool)
        or (k3s_restart_required | default(false) | bool)
        or not (k3s_existing_install_structurally_complete | default(false) | bool)
        or not (k3s_existing_service_active | default(false) | bool)
        or not (k3s_existing_service_enabled | default(false) | bool)
      }}
    k3s_kubectl_access_refresh_required: >-
      {{
        (k3s_install_required | bool)
        or (k3s_restart_required | default(false) | bool)
        or not (k3s_existing_install_structurally_complete | default(false) | bool)
        or (k3s_refresh_kubectl_access_on_existing_install | bool)
      }}

# ==================================================
# 4. Installer execution
# ==================================================

- name: Enforce install script checksum policy when requested
  assert:
    that:
      - not (k3s_require_install_script_checksum | bool) or (k3s_install_script_checksum | length > 0)
    fail_msg: >-
      k3s_require_install_script_checksum is enabled, but
      k3s_install_script_checksum is empty.
  when: k3s_install_required | bool

- name: Download K3s install script
  get_url:
    url: "{{ k3s_install_script_url }}"
    dest: "{{ k3s_install_script_path }}"
    owner: root
    group: root
    mode: "0755"
    timeout: "{{ k3s_install_script_timeout }}"
    checksum: "{{ k3s_install_script_checksum if k3s_install_script_checksum | length > 0 else omit }}"
  register: k3s_install_script_download
  when: k3s_install_required | bool
  until: k3s_install_script_download is succeeded
  retries: "{{ k3s_install_script_retries }}"
  delay: "{{ k3s_install_script_delay }}"

- name: Install K3s without implicit service start
  block:
    - name: Install K3s server from channel
      command: "{{ k3s_install_script_path }}"
      environment: >-
        {{
          {
            'INSTALL_K3S_CHANNEL': k3s_channel,
            'INSTALL_K3S_EXEC': (['server', k3s_server_args] | reject('equalto', '') | join(' ')),
            'INSTALL_K3S_SKIP_ENABLE': 'true',
            'INSTALL_K3S_SKIP_START': 'true'
          } | combine(k3s_server_env)
        }}
      no_log: "{{ k3s_hide_sensitive_config | bool }}"
      register: k3s_install_channel_result
      when:
        - k3s_install_required | bool
        - k3s_version | length == 0
      notify: Reload systemd

    - name: Install K3s server with explicit version
      command: "{{ k3s_install_script_path }}"
      environment: >-
        {{
          {
            'INSTALL_K3S_EXEC': (['server', k3s_server_args] | reject('equalto', '') | join(' ')),
            'INSTALL_K3S_SKIP_ENABLE': 'true',
            'INSTALL_K3S_SKIP_START': 'true',
            'INSTALL_K3S_VERSION': k3s_version
          } | combine(k3s_server_env)
        }}
      no_log: "{{ k3s_hide_sensitive_config | bool }}"
      register: k3s_install_version_result
      when:
        - k3s_install_required | bool
        - k3s_version | length > 0
      notify: Reload systemd

    - name: Flush systemd and service restart handlers
      meta: flush_handlers
  when: k3s_install_required | bool
  rescue:
    - name: Read K3s service status
      command: "systemctl status {{ k3s_service_name }} --no-pager -l"
      register: k3s_service_status
      changed_when: false
      failed_when: false
      when: k3s_collect_service_logs_on_failure | bool

    - name: Read K3s service journal
      command: "journalctl -u {{ k3s_service_name }} --no-pager -n 200"
      register: k3s_service_journal
      changed_when: false
      failed_when: false
      when: k3s_collect_service_logs_on_failure | bool

    - name: Read listeners during K3s startup failure
      command: ss -lntpH
      register: k3s_service_failure_listeners
      changed_when: false
      failed_when: false

    - name: Read rendered K3s config during startup failure
      slurp:
        path: "{{ k3s_config_path }}"
      register: k3s_config_failure_dump
      failed_when: false

    - name: Redact sensitive K3s config before persisting diagnostics
      set_fact:
        k3s_config_failure_dump_redacted: >-
          {{
            (
              (k3s_config_failure_dump.content | b64decode)
              if (k3s_config_failure_dump is defined and (k3s_config_failure_dump.content is defined))
              else 'not collected'
            )
            | regex_replace('(?im)^(\\s*(token|agent-token)\\s*:\\s*).*$','\\1<redacted>')
            | regex_replace('(?im)^(\\s*(pass|password|passwd|access-key|secret-key|token-file)\\s*:\\s*).*$','\\1<redacted>')
          }}

    - name: Persist K3s startup diagnostics to target file
      copy:
        dest: "{{ k3s_diagnostics_log_path }}"
        owner: root
        group: root
        mode: "0600"
        content: |
          K3s installation failed on {{ inventory_hostname }}.

          systemctl status:
          {{ (k3s_service_status.stdout | default('not collected')) | trim }}

          journalctl:
          {{ (k3s_service_journal.stdout | default('not collected')) | trim }}

          listeners:
          {{ (k3s_service_failure_listeners.stdout | default('not collected')) | trim }}

          install_state:
          detected={{ k3s_existing_install_detected | default(false) }}
          structurally_complete={{ k3s_existing_install_structurally_complete | default(false) }}
          service_active={{ k3s_existing_service_active | default(false) }}
          readyz_ok={{ k3s_existing_install_readyz_ok | default(false) }}
          install_required={{ k3s_install_required | default(false) }}

          rendered_config:
          {{ (k3s_config_failure_dump_redacted | default('not collected')) | trim }}

    - name: Fail with K3s startup diagnostics
      fail:
        msg: |
          K3s installation failed on {{ inventory_hostname }}.
          systemctl status:
          {{ (k3s_service_status.stdout | default('not collected')) | trim }}

          journalctl:
          {{ (k3s_service_journal.stdout | default('not collected')) | trim }}

          listeners:
          {{ (k3s_service_failure_listeners.stdout | default('not collected')) | trim }}

          install_state:
          detected={{ k3s_existing_install_detected | default(false) }}
          structurally_complete={{ k3s_existing_install_structurally_complete | default(false) }}
          service_active={{ k3s_existing_service_active | default(false) }}
          readyz_ok={{ k3s_existing_install_readyz_ok | default(false) }}
          install_required={{ k3s_install_required | default(false) }}

          rendered_config:
          {{ (k3s_config_failure_dump_redacted | default('not collected')) | trim }}

          diagnostics_file:
          {{ k3s_diagnostics_log_path }}

- name: Flush K3s restart handler before health checks
  meta: flush_handlers

- name: Ensure K3s service is enabled and started
  systemd_service:
    name: "{{ k3s_service_name }}"
    enabled: true
    state: started
    no_block: true
  when: k3s_service_state_enforcement_required | bool

# ==================================================
# 5. Configure kubectl access
# ==================================================

- name: Wait for K3s startup artifacts before configuring kubectl access
  block:
    - name: Wait for K3s service to become active
      command: "systemctl is-active {{ k3s_service_name }}"
      register: k3s_service_active_before_kubeconfig
      changed_when: false
      retries: "{{ k3s_startup_retries }}"
      delay: "{{ k3s_startup_delay }}"
      until: k3s_service_active_before_kubeconfig.stdout == "active"

    - name: Wait for K3s kubeconfig before configuring kubectl access
      wait_for:
        path: "{{ k3s_kubeconfig_path }}"
        timeout: "{{ k3s_wait_for_kubeconfig_timeout }}"
  when: k3s_wait_for_startup_artifacts_required | bool
  rescue:
    - name: Read K3s service status after kubeconfig wait failure
      command: "systemctl status {{ k3s_service_name }} --no-pager -l"
      register: k3s_service_status_before_kubeconfig_failure
      changed_when: false
      failed_when: false

    - name: Read K3s service journal after kubeconfig wait failure
      command: "journalctl -u {{ k3s_service_name }} --no-pager -n 200"
      register: k3s_service_journal_before_kubeconfig_failure
      changed_when: false
      failed_when: false

    - name: Read listeners after kubeconfig wait failure
      command: ss -lntpH
      register: k3s_listener_snapshot_before_kubeconfig_failure
      changed_when: false
      failed_when: false

    - name: Persist K3s kubeconfig wait diagnostics to target file
      copy:
        dest: "{{ k3s_diagnostics_log_path }}"
        owner: root
        group: root
        mode: "0600"
        content: |
          K3s service did not become ready on {{ inventory_hostname }}.
          kubeconfig_path={{ k3s_kubeconfig_path }}.
          incomplete_install_detected={{ k3s_incomplete_install_detected | default(false) }}.

          systemctl status:
          {{ (k3s_service_status_before_kubeconfig_failure.stdout | default('not collected')) | trim }}

          journalctl:
          {{ (k3s_service_journal_before_kubeconfig_failure.stdout | default('not collected')) | trim }}

          listeners:
          {{ (k3s_listener_snapshot_before_kubeconfig_failure.stdout | default('not collected')) | trim }}

    - name: Fail with K3s startup diagnostics before kubectl configuration
      fail:
        msg: |
          K3s service did not become ready on {{ inventory_hostname }}.
          kubeconfig_path={{ k3s_kubeconfig_path }}.
          incomplete_install_detected={{ k3s_incomplete_install_detected | default(false) }}.

          systemctl status:
          {{ (k3s_service_status_before_kubeconfig_failure.stdout | default('not collected')) | trim }}

          journalctl:
          {{ (k3s_service_journal_before_kubeconfig_failure.stdout | default('not collected')) | trim }}

          listeners:
          {{ (k3s_listener_snapshot_before_kubeconfig_failure.stdout | default('not collected')) | trim }}

          diagnostics_file:
          {{ k3s_diagnostics_log_path }}

- name: Ensure root kubeconfig directory exists
  file:
    path: "{{ k3s_root_kubeconfig_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0700"
  when: k3s_kubectl_access_refresh_required | bool

- name: Copy K3s kubeconfig to root
  copy:
    src: "{{ k3s_kubeconfig_path }}"
    dest: "{{ k3s_root_kubeconfig_path }}"
    remote_src: true
    owner: root
    group: root
    mode: "0600"
  when: k3s_kubectl_access_refresh_required | bool

- name: Inspect existing kubectl command path
  stat:
    path: "{{ k3s_kubectl_wrapper_path }}"
    follow: false
  register: k3s_kubectl_command_stat
  when:
    - k3s_kubectl_access_refresh_required | bool
    - k3s_manage_kubectl_wrapper | bool

- name: Remove K3s kubectl symlink before installing wrapper
  file:
    path: "{{ k3s_kubectl_wrapper_path }}"
    state: absent
  when:
    - k3s_kubectl_access_refresh_required | bool
    - k3s_manage_kubectl_wrapper | bool
    - k3s_kubectl_command_stat.stat.islnk | default(false)

- name: Install kubectl wrapper for direct user access
  template:
    src: kubectl-wrapper.sh.j2
    dest: "{{ k3s_kubectl_wrapper_path }}"
    owner: root
    group: root
    mode: "0755"
  when:
    - k3s_kubectl_access_refresh_required | bool
    - k3s_manage_kubectl_wrapper | bool

- name: Query remote user account
  getent:
    database: passwd
    key: "{{ ansible_user }}"
  when:
    - k3s_kubectl_access_refresh_required | bool
    - k3s_copy_kubeconfig_to_remote_user | bool
    - ansible_user != "root"

- name: Extract remote user home directory
  set_fact:
    k3s_remote_user_home: "{{ ansible_facts.getent_passwd[ansible_user][-2] }}"
  when:
    - k3s_kubectl_access_refresh_required | bool
    - k3s_copy_kubeconfig_to_remote_user | bool
    - ansible_user != "root"

- name: Ensure remote user kubeconfig directory exists
  file:
    path: "{{ k3s_remote_user_home }}/.kube"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0700"
  when:
    - k3s_kubectl_access_refresh_required | bool
    - k3s_copy_kubeconfig_to_remote_user | bool
    - ansible_user != "root"

- name: Copy K3s kubeconfig to remote user
  copy:
    src: "{{ k3s_kubeconfig_path }}"
    dest: "{{ k3s_remote_user_home }}/.kube/config"
    remote_src: true
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0600"
  when:
    - k3s_kubectl_access_refresh_required | bool
    - k3s_copy_kubeconfig_to_remote_user | bool
    - ansible_user != "root"

- name: Configure kubectl shell environment for remote user
  blockinfile:
    path: "{{ k3s_remote_user_home }}/{{ k3s_remote_user_shell_rc_path }}"
    create: true
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0644"
    marker: "# {mark} ANSIBLE MANAGED BLOCK - K3S KUBECTL ENV"
    block: |
      export K3S_CONFIG_FILE=/dev/null
      export KUBECONFIG="$HOME/.kube/config"
  when:
    - k3s_kubectl_access_refresh_required | bool
    - k3s_copy_kubeconfig_to_remote_user | bool
    - k3s_manage_remote_user_shell_env | bool
    - ansible_user != "root"

# ==================================================
# 6. K3s service and cluster health checks
# ==================================================

- name: Validate K3s cluster health
  block:
    - name: Wait for K3s API server port
      wait_for:
        host: 127.0.0.1
        port: 6443
        timeout: "{{ k3s_wait_for_apiserver_timeout }}"

    - name: Check K3s service active state
      command: "systemctl is-active {{ k3s_service_name }}"
      register: k3s_service_active
      changed_when: false
      retries: "{{ k3s_healthcheck_retries }}"
      delay: "{{ k3s_healthcheck_delay }}"
      until: k3s_service_active.stdout == "active"

    - name: Wait for Kubernetes API readiness
      command: >-
        {{ k3s_binary_path }} kubectl --kubeconfig={{ k3s_kubeconfig_path }}
        --request-timeout={{ k3s_kubectl_request_timeout }} get --raw=/readyz
      register: k3s_apiserver_ready
      changed_when: false
      retries: "{{ k3s_healthcheck_retries }}"
      delay: "{{ k3s_healthcheck_delay }}"
      until: k3s_apiserver_ready.rc == 0 and 'ok' in k3s_apiserver_ready.stdout

    - name: Wait for K3s node to become Ready
      command: >-
        {{ k3s_binary_path }} kubectl --kubeconfig={{ k3s_kubeconfig_path }}
        wait --for=condition=Ready node/{{ k3s_node_name }} --timeout={{ k3s_healthcheck_timeout }}
      register: k3s_node_ready
      changed_when: false

    - name: Ensure kube-system pods are healthy
      command: >-
        {{ k3s_binary_path }} kubectl --kubeconfig={{ k3s_kubeconfig_path }}
        --request-timeout={{ k3s_kubectl_request_timeout }}
        get pods -n kube-system --no-headers
      register: k3s_kube_system_pods_health
      changed_when: false
      failed_when: >-
        (
          k3s_kube_system_pods_health.stdout_lines
          | select('search', '\\s(Error|CrashLoopBackOff|ImagePullBackOff|ErrImagePull|CreateContainerConfigError|Pending|Unknown|Failed)\\s')
          | list
          | length
        ) > 0

    - name: Wait for CoreDNS rollout
      command: >-
        {{ k3s_binary_path }} kubectl --kubeconfig={{ k3s_kubeconfig_path }}
        -n kube-system rollout status deploy/coredns --timeout={{ k3s_healthcheck_timeout }}
      register: k3s_coredns_rollout
      changed_when: false
      when:
        - k3s_deep_healthcheck_required | bool
        - k3s_coredns_expected | bool

    - name: Wait for local-path-provisioner rollout
      command: >-
        {{ k3s_binary_path }} kubectl --kubeconfig={{ k3s_kubeconfig_path }}
        -n kube-system rollout status deploy/local-path-provisioner --timeout={{ k3s_healthcheck_timeout }}
      register: k3s_local_path_rollout
      changed_when: false
      when:
        - k3s_deep_healthcheck_required | bool
        - k3s_local_path_expected | bool

    - name: Wait for metrics-server rollout
      command: >-
        {{ k3s_binary_path }} kubectl --kubeconfig={{ k3s_kubeconfig_path }}
        -n kube-system rollout status deploy/metrics-server --timeout={{ k3s_healthcheck_timeout }}
      register: k3s_metrics_rollout
      changed_when: false
      when:
        - k3s_deep_healthcheck_required | bool
        - k3s_metrics_server_expected | bool

    - name: Capture cluster node summary
      command: >-
        {{ k3s_binary_path }} kubectl --kubeconfig={{ k3s_kubeconfig_path }}
        --request-timeout={{ k3s_kubectl_request_timeout }}
        get nodes -o wide
      register: k3s_cluster_nodes
      changed_when: false
      when: k3s_deep_healthcheck_required | bool

    - name: Capture cluster pod summary
      command: >-
        {{ k3s_binary_path }} kubectl --kubeconfig={{ k3s_kubeconfig_path }}
        --request-timeout={{ k3s_kubectl_request_timeout }}
        get pods -A -o wide
      register: k3s_cluster_pods
      changed_when: false
      when: k3s_deep_healthcheck_required | bool

    - name: Ensure all cluster pods are healthy during deep validation
      command: >-
        {{ k3s_binary_path }} kubectl --kubeconfig={{ k3s_kubeconfig_path }}
        --request-timeout={{ k3s_kubectl_request_timeout }}
        get pods -A --no-headers
      register: k3s_cluster_pods_health
      changed_when: false
      failed_when: >-
        (
          k3s_cluster_pods_health.stdout_lines
          | select('search', '\\s(Error|CrashLoopBackOff|ImagePullBackOff|ErrImagePull|CreateContainerConfigError|Pending|Unknown|Failed)\\s')
          | list
          | length
        ) > 0
      when: k3s_deep_healthcheck_required | bool
  rescue:
    - name: Gather cluster nodes for diagnostics
      command: >-
        {{ k3s_binary_path }} kubectl --kubeconfig={{ k3s_kubeconfig_path }}
        --request-timeout={{ k3s_kubectl_request_timeout }}
        get nodes -o wide
      register: k3s_cluster_nodes_failed
      changed_when: false
      failed_when: false

    - name: Gather cluster pods for diagnostics
      command: >-
        {{ k3s_binary_path }} kubectl --kubeconfig={{ k3s_kubeconfig_path }}
        --request-timeout={{ k3s_kubectl_request_timeout }}
        get pods -A -o wide
      register: k3s_cluster_pods_failed
      changed_when: false
      failed_when: false

    - name: Gather recent Kubernetes events
      command: >-
        {{ k3s_binary_path }} kubectl --kubeconfig={{ k3s_kubeconfig_path }}
        --request-timeout={{ k3s_kubectl_request_timeout }}
        get events -A --sort-by=.lastTimestamp
      register: k3s_cluster_events_failed
      changed_when: false
      failed_when: false

    - name: Read K3s journal after health check failure
      command: "journalctl -u {{ k3s_service_name }} --no-pager -n 200"
      register: k3s_service_journal_failed
      changed_when: false
      failed_when: false

    - name: Persist K3s health check diagnostics to target file
      copy:
        dest: "{{ k3s_diagnostics_log_path }}"
        owner: root
        group: root
        mode: "0600"
        content: |
          K3s installed but cluster health validation failed on {{ inventory_hostname }}.

          Nodes:
          {{ (k3s_cluster_nodes_failed.stdout | default('not collected')) | trim }}

          Pods:
          {{ (k3s_cluster_pods_failed.stdout | default('not collected')) | trim }}

          Events:
          {{ (k3s_cluster_events_failed.stdout | default('not collected')) | trim }}

          K3s journal:
          {{ (k3s_service_journal_failed.stdout | default('not collected')) | trim }}

    - name: Fail with K3s cluster health diagnostics
      fail:
        msg: |
          K3s installed but cluster health validation failed on {{ inventory_hostname }}.
          Nodes:
          {{ (k3s_cluster_nodes_failed.stdout | default('not collected')) | trim }}

          Pods:
          {{ (k3s_cluster_pods_failed.stdout | default('not collected')) | trim }}

          Events:
          {{ (k3s_cluster_events_failed.stdout | default('not collected')) | trim }}

          K3s journal:
          {{ (k3s_service_journal_failed.stdout | default('not collected')) | trim }}

          diagnostics_file:
          {{ k3s_diagnostics_log_path }}
