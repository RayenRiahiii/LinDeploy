user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log notice;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
}

http {
    resolver 127.0.0.11 ipv6=off valid=30s;
    access_log /var/log/nginx/access.log;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    client_max_body_size 0;
    client_header_timeout 10s;
    client_body_timeout 10s;
    large_client_header_buffers 2 8k;
    limit_conn_zone $binary_remote_addr zone=per_client:10m;
    limit_req_zone $binary_remote_addr zone=request_rate:10m rate=20r/s;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_certificate /etc/nginx/certs/mirror.crt;
    ssl_certificate_key /etc/nginx/certs/mirror.key;
    ssl_session_cache shared:SSL:10m;

    server {
        listen 5001 ssl;
        limit_conn per_client 16;
        limit_req zone=request_rate burst=40 nodelay;
        location / {
            proxy_pass http://registry-k8s:5000;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_buffering off;
            proxy_read_timeout 600s;
        }
    }

    server {
        listen 5002 ssl;
        limit_conn per_client 16;
        limit_req zone=request_rate burst=40 nodelay;
        location / {
            proxy_pass http://registry-quay:5000;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_buffering off;
            proxy_read_timeout 600s;
        }
    }

    server {
        listen 5003 ssl;
        limit_conn per_client 16;
        limit_req zone=request_rate burst=40 nodelay;
        location / {
            proxy_pass http://registry-docker:5000;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_buffering off;
            proxy_read_timeout 600s;
        }
    }

    server {
        listen 8443 ssl;
        limit_conn per_client 16;
        limit_req zone=request_rate burst=40 nodelay;

        allow 10.0.0.0/8;
        allow 100.64.0.0/10;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
        location /cache/ {
            proxy_pass http://artifact-cache:8080;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_request_buffering off;
            proxy_buffering off;
            proxy_read_timeout 1800s;
        }

        location /cache-ready/ {
            proxy_pass http://artifact-cache:8080;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_buffering off;
            proxy_read_timeout 30s;
        }

        location = /healthz {
            proxy_pass http://artifact-cache:8080/healthz;
        }

        location = /readyz {
            proxy_pass http://artifact-cache:8080/readyz;
        }

        location = /metrics {
            proxy_pass http://artifact-cache:8080/metrics;
        }
    }
}
