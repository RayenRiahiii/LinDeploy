name: lindeploy-mirror

services:
  registry-k8s:
    image: ghcr.io/project-zot/zot-linux-amd64:v2.1.18@sha256:34f18f783037f967dba10df02f9d4086c4d626f5643ef9f5e51e4a4547280a0b
    restart: unless-stopped
    command: ["serve", "/etc/zot/config.json"]
    volumes:
      - registry-k8s-data:/var/lib/zot
      - ./registry/zot-k8s.json:/etc/zot/config.json:ro
    networks: [mirror]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    pids_limit: 256
    mem_limit: 1g
    cpus: 1.0
    logging: &bounded-logs
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  registry-quay:
    image: ghcr.io/project-zot/zot-linux-amd64:v2.1.18@sha256:34f18f783037f967dba10df02f9d4086c4d626f5643ef9f5e51e4a4547280a0b
    restart: unless-stopped
    command: ["serve", "/etc/zot/config.json"]
    volumes:
      - registry-quay-data:/var/lib/zot
      - ./registry/zot-quay.json:/etc/zot/config.json:ro
    networks: [mirror]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    pids_limit: 256
    mem_limit: 1g
    cpus: 1.0
    logging: *bounded-logs

  registry-docker:
    image: ghcr.io/project-zot/zot-linux-amd64:v2.1.18@sha256:34f18f783037f967dba10df02f9d4086c4d626f5643ef9f5e51e4a4547280a0b
    restart: unless-stopped
    command: ["serve", "/etc/zot/config.json"]
    volumes:
      - registry-docker-data:/var/lib/zot
      - ./registry/zot-docker.json:/etc/zot/config.json:ro
    networks: [mirror]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    pids_limit: 256
    mem_limit: 1g
    cpus: 1.0
    logging: *bounded-logs

  artifact-cache:
    build:
      context: ./artifact-cache
    restart: unless-stopped
    environment:
      MIRROR_CACHE_DIR: /var/cache/lindeploy
      MIRROR_CACHE_MAX_BYTES: ${MIRROR_CACHE_MAX_BYTES:-12884901888}
      MIRROR_CACHE_RESERVED_FREE_BYTES: ${MIRROR_CACHE_RESERVED_FREE_BYTES:-2147483648}
      MIRROR_CACHE_MAX_OBJECT_BYTES: ${MIRROR_CACHE_MAX_OBJECT_BYTES:-4294967296}
      MIRROR_MAX_WORKERS: ${MIRROR_MAX_WORKERS:-32}
      MIRROR_UPSTREAM_TIMEOUT: ${MIRROR_UPSTREAM_TIMEOUT:-900}
      MIRROR_METADATA_TTL: ${MIRROR_METADATA_TTL:-3600}
      MIRROR_PAYLOAD_REVALIDATE_TTL: ${MIRROR_PAYLOAD_REVALIDATE_TTL:-300}
    volumes:
      - artifact-cache-data:/var/cache/lindeploy
    networks: [mirror]
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=64m"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    pids_limit: 128
    mem_limit: 768m
    cpus: 1.5
    logging: *bounded-logs
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  gateway:
    image: nginx:1.28-alpine@sha256:a8b39bd9cf0f83869a2162827a0caf6137ddf759d50a171451b335cecc87d236
    restart: unless-stopped
    depends_on:
      artifact-cache:
        condition: service_healthy
      registry-k8s:
        condition: service_started
      registry-quay:
        condition: service_started
      registry-docker:
        condition: service_started
    ports:
      - "0.0.0.0:5001:5001"
      - "0.0.0.0:5002:5002"
      - "0.0.0.0:5003:5003"
      - "0.0.0.0:8443:8443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./runtime/certs:/etc/nginx/certs:ro
    networks: [mirror]
    read_only: true
    tmpfs:
      - /var/cache/nginx:rw,noexec,nosuid,size=64m
      - /var/run:rw,noexec,nosuid,size=8m
      - /var/log/nginx:rw,noexec,nosuid,size=32m
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    pids_limit: 128
    mem_limit: 512m
    cpus: 1.0
    logging: *bounded-logs

networks:
  mirror:
    driver: bridge

volumes:
  registry-k8s-data:
  registry-quay-data:
  registry-docker-data:
  artifact-cache-data:
